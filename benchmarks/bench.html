<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reactive CSS benchmark</title>
  <style>
    body { margin: 0; font: 12px monospace; }
    #root { position: relative; width: 600px; height: 400px; overflow: hidden; }
    .e { position: absolute; left: 0; top: 0; width: 4px; height: 4px; background: #555; }
    .g { display: flex; }
    .g > i { width: 4px; height: 4px; background: #ccc; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="module">
// ?scenario=static|live2s|live200|mouse|mouselocal|checkbox|nthvar|insert|churn|mixed &n=1000
// &impl=rcss | baseline (v0.1.0 build) | plain (direct property) | plainvars (same custom properties as rcss) | none (DOM only)
// The page builds the DOM, starts the implementation, then exposes window.bench for run.mjs.
const q = new URLSearchParams(location.search);
const scenario = q.get('scenario'), n = +q.get('n'), impl = q.get('impl') ?? 'rcss';
// &build=min (default: the production bundle users load) | dev (ESM build with development checks)
const bundle = q.get('build') ?? 'min';
// &seed=N: deterministic Math.random for every implementation (random(), plain JS references)
{ let a = +(q.get('seed') ?? 1) >>> 0; Math.random = () => { a = (a + 0x6D2B79F5) >>> 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t ^= t + Math.imul(t ^ (t >>> 7), 61 | t); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const root = document.getElementById('root');
const rand = (a, b) => a + Math.random() * (b - a);

const CSS = {
  static: `.e { translate: random(0px, 596px) random(0px, 396px) }`,
  // Same, but "by" steps keep it on the JavaScript path even where native random() exists.
  staticjs: `.e { translate: random(0px, 596px, by 1px) random(0px, 396px, by 1px) }`,
  live2s: `.e { translate: live(random(0px, 596px), 2s) live(random(0px, 396px), 2s) }`,
  live200: `.e { translate: live(random(0px, 596px), 200ms) live(random(0px, 396px), 200ms) }`,
  mouse: `.e { translate: mouse(x) mouse(y) }`,
  checkbox: `input:just-checked + i { animation: a 300ms } input:just-unchecked + i { animation: b 300ms } @keyframes a { from { opacity: .5 } } @keyframes b { from { opacity: .5 } }`,
  nthvar: `.g { --active: 1 } .g > i:nth-var(--active) { background: red }`,
  insert: `.e { translate: live(random(0px, 596px), 2s) 0px }`,
  mixed: `.e { translate: random(0px, 596px) 10px } .e.r { translate: live(random(0px, 596px), 200ms) 20px }`,
  // Paint-only effect so the elements do not move under the pointer they measure against.
  mouselocal: `.e { box-shadow: mouse(x, local) mouse(y, local) 0 #f00 }`,
  churn: `.e { translate: live(random(0px, 596px), 2s) live(random(0px, 396px), 2s) }`,
  // Phase 5: state. n independent components, each with a toggle, a when() and a :when().
  components: `.c { --on: state(false); display: inline-block } .c b { on: click(toggle(--on)) } .c i { display: inline-block; width: 4px; height: 4px; opacity: when(--on, 1, 0.3) } .c:when(--on) { outline: 1px solid red }`,
  // One state, n subscribers.
  fanout: `.root { --on: state(false) } #t { on: click(toggle(--on)) } .root i { display: inline-block; width: 4px; height: 4px; opacity: when(--on, 1, 0.3) }`,
  // n/10 tab components with 10 tabs and 10 panels each, driven by state + :nth-var().
  tabsstate: `.tabs { --active: state(1) } .tab { on: click(set(--active, sibling-index())) } .tab:nth-var(--active) { color: red } .panel { display: none } .panel:nth-var(--active) { display: block }`,
  // Three nested scopes per group, each with its own state and consumer.
  nested: `.s { --on: state(false) } .s > b { on: click(toggle(--on)) } .s > i { display: inline-block; width: 4px; height: 4px; opacity: when(--on, 1, 0.3) }`,
  // Components mounted and unmounted continuously (1% per frame).
  statechurn: `.c { --on: state(false); display: inline-block } .c b { on: click(toggle(--on)) } .c i { display: inline-block; width: 4px; height: 4px; opacity: when(--on, 1, 0.3) } .c:when(--on) { outline: 1px solid red }`,
};
Object.assign(CSS, {
  // 0.3
  bindtext: `.b { --v: state(""); display: inline-block } .b input { bind: --v; width: 30px } .b::after { content: var(--v) }`,
  bindcheck: `.b { --on: state(false); display: inline-block } .b input { bind: --on } .b i { display: inline-block; width: 4px; height: 4px; opacity: when(--on, 1, 0.3) }`,
  changed: `.h { --n: state(0); display: inline-block } .h b { on: click(increment(--n)) } .h:changed(--n) i { animation: f 200ms } .h i { display: inline-block; width: calc(4px + (var(--n) - previous(--n)) * 1px); height: 4px } @keyframes f { from { opacity: 0.3 } }`,
  // 0.5.2: toggle buttons whose state is bound to aria-pressed; the same state unbound (:when()).
  pressed: `.pb { --on: state(false, bind(aria-pressed)); on: click(toggle(--on)); display: inline-block; width: 4px; height: 4px } .pb[aria-pressed="true"] { outline: 1px solid red }`,
  pressedstate: `.pb { --on: state(false); on: click(toggle(--on)); display: inline-block; width: 4px; height: 4px } .pb:when(--on) { outline: 1px solid red }`,
  // 0.5.1: a counter shown as real DOM text (text:).
  textcount: `.t { --n: state(0); display: inline-block } .t b { on: click(increment(--n)) } .t span { text: var(--n) }`,
  // 0.5.3: ancestor state, attribute on a sibling element (written in the click's task, so one forced style read per click).
  derived: `.dv { --on: state(false); display: inline-block } .dv b { on: click(toggle(--on)) } .dv button { attr: disabled var(--on); width: 4px; height: 4px; padding: 0 } .dv button:disabled { outline: 1px solid red }`,
  // 0.5: state from the owner's attribute; each click sets one entry of the button's list.
  attrsplit: `.a { --m: state(attr(data-m)); display: inline-block } .a b { on: click(set(--m, pick(split(attr(data-o), "|")))) } .a i::after { content: var(--m) }`,
  keyout: `.d { --open: state(true); display: inline-block; on: outside(click, set(--open, false)), key(Escape, set(--open, false)) } .d b { on: click(set(--open, true)) } .d i { display: inline-block; width: 4px; height: 4px; opacity: when(--open, 1, 0.3) }`,
});
Object.assign(CSS, {
  // 0.4: each element reads its own width; children use it. The container resizes every frame.
  geometry: `#root { width: 600px } .g { --w: element(width); display: block; height: 2px } .g i { display: block; height: 1px; width: calc(var(--w) / 2) }`,
});
CSS.components_runtime = CSS.components;
CSS.fanout_runtime = CSS.fanout;
// Plain-JS equivalents: same DOM, an attribute toggled by one delegated listener, native CSS selectors.
const PLAIN_STATE_CSS = {
  geometry: `#root { width: 600px } .g { display: block; height: 2px } .g i { display: block; height: 1px; width: calc(var(--w) / 2) }`,
  bindtext: `.b { display: inline-block } .b input { width: 30px } .b::after { content: attr(data-v) }`,
  attrsplit: `.a { display: inline-block } .a i::after { content: attr(data-m) }`,
  textcount: `.t { display: inline-block }`,
  pressed: `.pb { display: inline-block; width: 4px; height: 4px } .pb[aria-pressed="true"] { outline: 1px solid red }`,
  derived: `.dv { display: inline-block } .dv button { width: 4px; height: 4px; padding: 0 } .dv button:disabled { outline: 1px solid red }`,
  bindcheck: `.b { display: inline-block } .b i { display: inline-block; width: 4px; height: 4px; opacity: 0.3 } .b[data-on] i { opacity: 1 }`,
  components: `.c { display: inline-block } .c i { display: inline-block; width: 4px; height: 4px; opacity: 0.3 } .c[data-on] i { opacity: 1 } .c[data-on] { outline: 1px solid red }`,
  fanout: `.root i { display: inline-block; width: 4px; height: 4px; opacity: 0.3 } .root[data-on] i { opacity: 1 }`,
};
const COMPONENT = '<b>t</b><i></i>';

function build() {
  const f = document.createDocumentFragment();
  if (scenario === 'checkbox') {
    for (let i = 0; i < n; i++) { const l = document.createElement('label'); l.innerHTML = '<input type="checkbox"><i></i>'; f.append(l); }
  } else if (scenario === 'nthvar') {
    for (let i = 0; i < n / 10; i++) { const g = document.createElement('div'); g.className = 'g'; g.innerHTML = '<i></i>'.repeat(10); f.append(g); }
  } else if (scenario === 'geometry') {
    for (let i = 0; i < n; i++) { const g = document.createElement('div'); g.className = 'g'; g.innerHTML = '<i></i>'; f.append(g); }
  } else if (scenario === 'bindtext' || scenario === 'bindcheck') {
    const inner = scenario === 'bindtext' ? '<input>' : '<input type="checkbox"><i></i>';
    for (let i = 0; i < n; i++) { const c = document.createElement('span'); c.className = 'b'; c.innerHTML = inner; f.append(c); }
  } else if (scenario === 'pressed' || scenario === 'pressedstate') {
    for (let i = 0; i < n; i++) { const b = document.createElement('b'); b.className = 'pb'; f.append(b); }
  } else if (scenario === 'derived') {
    for (let i = 0; i < n; i++) { const c = document.createElement('span'); c.className = 'dv'; c.innerHTML = '<b>t</b><button></button>'; f.append(c); }
  } else if (scenario === 'textcount') {
    for (let i = 0; i < n; i++) { const c = document.createElement('span'); c.className = 't'; c.innerHTML = '<b>t</b><span>0</span>'; f.append(c); }
  } else if (scenario === 'attrsplit') {
    for (let i = 0; i < n; i++) { const c = document.createElement('span'); c.className = 'a'; c.dataset.m = 'm' + i; c.innerHTML = '<b data-o="Hello!|Bonjour!|Hola!|Ciao!">t</b><i></i>'; f.append(c); }
  } else if (scenario === 'changed' || scenario === 'keyout') {
    const cls = scenario === 'changed' ? 'h' : 'd';
    for (let i = 0; i < n; i++) { const c = document.createElement('span'); c.className = cls; c.innerHTML = '<b>t</b><i></i>'; f.append(c); }
  } else if (scenario === 'components' || scenario === 'statechurn' || scenario === 'components_runtime') {
    for (let i = 0; i < n; i++) { const c = document.createElement('span'); c.className = 'c'; c.innerHTML = COMPONENT; f.append(c); }
  } else if (scenario === 'fanout' || scenario === 'fanout_runtime') {
    const r = document.createElement('div'); r.className = 'root'; r.innerHTML = '<b id="t">t</b>' + '<i></i>'.repeat(n); f.append(r);
  } else if (scenario === 'tabsstate') {
    const row = '<button class="tab">t</button>'.repeat(10), panels = '<div class="panel">p</div>'.repeat(10);
    for (let i = 0; i < n / 10; i++) { const t = document.createElement('div'); t.className = 'tabs'; t.innerHTML = `<div>${row}</div><div>${panels}</div>`; f.append(t); }
  } else if (scenario === 'nested') {
    const inner = '<b>t</b><i></i>';
    for (let i = 0; i < n / 3; i++) { const t = document.createElement('div'); t.className = 's'; t.innerHTML = `${inner}<div class="s">${inner}<div class="s">${inner}</div></div>`; f.append(t); }
  } else if (scenario === 'mouselocal') {
    for (let i = 0; i < n; i++) { const e = document.createElement('div'); e.className = 'e'; e.style.left = (i % 100) * 6 + 'px'; e.style.top = Math.floor(i / 100) * 4 + 'px'; f.append(e); }
  } else if (scenario !== 'insert') {
    for (let i = 0; i < n; i++) { const e = document.createElement('div'); e.className = scenario === 'mixed' && i % 2 ? 'e r' : 'e'; f.append(e); }
  }
  root.append(f);
}

// Plain JavaScript reference implementations of the same visual result.
const plain = {
  static() { for (const e of root.children) e.style.translate = `${rand(0, 596)}px ${rand(0, 396)}px`; },
  liveVars(ms) {
    const els = [...root.children];
    const write = () => { for (const e of els) { e.style.setProperty('--x', rand(0, 596) + 'px'); e.style.setProperty('--y', rand(0, 396) + 'px'); } };
    write();
    setInterval(() => requestAnimationFrame(write), ms);
  },
  live(ms) {
    const els = [...root.children];
    plain.static();
    setInterval(() => requestAnimationFrame(() => { for (const e of els) e.style.translate = `${rand(0, 596)}px ${rand(0, 396)}px`; }), ms);
  },
  // Fair variant of the reactive CSS mechanism: same CSS, two custom properties per element.
  mouseVars() {
    const els = [...root.children];
    let x = 0, y = 0, pending = false;
    addEventListener('pointermove', (ev) => {
      x = ev.clientX; y = ev.clientY;
      if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; for (const e of els) { e.style.setProperty('--x', x + 'px'); e.style.setProperty('--y', y + 'px'); } }); }
    }, { passive: true });
  },
  mouseLocalVars() {
    const els = [...root.children];
    let x = 0, y = 0, pending = false;
    addEventListener('pointermove', (ev) => {
      x = ev.clientX; y = ev.clientY;
      if (!pending) {
        pending = true;
        requestAnimationFrame(() => {
          pending = false;
          const rects = els.map((e) => e.getBoundingClientRect()); // all reads, then all writes
          els.forEach((e, i) => { e.style.setProperty('--x', x - rects[i].left + 'px'); e.style.setProperty('--y', y - rects[i].top + 'px'); });
        });
      }
    }, { passive: true });
  },
  // One inherited custom property pair on the root instead of per-element writes.
  mouseRoot() {
    const de = document.documentElement;
    let x = 0, y = 0, pending = false;
    addEventListener('pointermove', (ev) => {
      x = ev.clientX; y = ev.clientY;
      if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; de.style.setProperty('--x', x + 'px'); de.style.setProperty('--y', y + 'px'); }); }
    }, { passive: true });
  },
  mouse() {
    const els = [...root.children];
    let x = 0, y = 0, pending = false;
    addEventListener('pointermove', (ev) => {
      x = ev.clientX; y = ev.clientY;
      if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; for (const e of els) e.style.translate = `${x}px ${y}px`; }); }
    }, { passive: true });
  },
};

let api;
build();
const style = document.createElement('style');
const t0 = performance.now();
if (scenario.endsWith('_runtime')) window.ReactiveCSSConfig = { native: false }; // force the runtime path of when()
if (impl === 'rcss' || impl === 'baseline') {
  // baseline = the v0.1.0 build kept in benchmarks/baseline for before/after comparisons
  style.textContent = CSS[scenario];
  document.head.append(style);
  if (impl === 'rcss' && bundle === 'min') {
    // The production IIFE: evaluating it starts the library (the document is already parsed).
    const code = await (await fetch('/dist/reactive-css.min.js')).text();
    const s = document.createElement('script');
    s.src = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
    var tImport = performance.now();
    await new Promise((r) => { s.onload = r; document.head.append(s); });
    api = window.ReactiveCSS;
  } else {
    // baseline = the v0.1.0 build kept in benchmarks/baseline for before/after comparisons
    api = await import(impl === 'baseline' ? '/benchmarks/baseline/index.js' : '/dist/index.js');
    var tImport = performance.now();
    api.start();
  }
} else if (impl === 'plain' && PLAIN_STATE_CSS[scenario]) {
  style.textContent = PLAIN_STATE_CSS[scenario];
  document.head.append(style);
  var tImport = performance.now();
  root.addEventListener('click', (e) => {
    const owner = e.target.closest(scenario === 'fanout' ? '.root' : '.c');
    owner?.toggleAttribute('data-on');
  });
  root.addEventListener('input', (e) => { const b = e.target.closest('.b'); if (b) b.dataset.v = e.target.value; });
  if (scenario === 'pressed') {
    // the hand-written equivalent of state(false, bind(aria-pressed)) + toggle(): flip the attribute
    for (const b of root.children) b.setAttribute('aria-pressed', 'false');
    root.addEventListener('click', (e) => { const b = e.target.closest('.pb'); if (b) b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); });
  }
  if (scenario === 'derived') {
    // the hand-written equivalent of attr: disabled var(--on) with toggle(): flip the sibling's attribute
    root.addEventListener('click', (e) => { const b = e.target.closest('.dv b'); if (b) b.nextElementSibling.toggleAttribute('disabled'); });
  }
  if (scenario === 'textcount') {
    // the hand-written equivalent of text: var(--n) with increment(): a delegated listener
    root.addEventListener('click', (e) => {
      const b = e.target.closest('.t b'); if (!b) return;
      const t = b.parentElement; t.n = (t.n ?? 0) + 1; t.querySelector('span').textContent = t.n;
    });
  }
  if (scenario === 'attrsplit') {
    // the hand-written equivalent: copy the owner's attribute at start, set a random entry on click
    for (const a of root.children) a.querySelector('i').dataset.m = a.dataset.m;
    root.addEventListener('click', (e) => {
      const b = e.target.closest('.a b'); if (!b) return;
      const list = b.dataset.o.split('|').map((x) => x.trim()).filter(Boolean);
      b.parentElement.querySelector('i').dataset.m = list[Math.floor(Math.random() * list.length)];
    });
  }
  if (scenario === 'geometry') {
    // the hand-written equivalent of element(width): one ResizeObserver writing --w
    const ro = new ResizeObserver((es) => { for (const e of es) e.target.style.setProperty('--w', e.borderBoxSize[0].inlineSize + 'px'); });
    for (const g of root.children) ro.observe(g, { box: 'border-box' });
  }
  root.addEventListener('change', (e) => { const b = e.target.closest('.b'); if (b && e.target.type === 'checkbox') b.toggleAttribute('data-on', e.target.checked); });
} else if (impl === 'none') {
  var tImport = performance.now();
} else if (impl === 'plainvars' || impl === 'plainroot') {
  style.textContent = scenario === 'mouselocal' ? '.e { box-shadow: var(--x, 0px) var(--y, 0px) 0 #f00 }' : '.e { translate: var(--x, 0px) var(--y, 0px) }';
  document.head.append(style);
  var tImport = performance.now();
  if (scenario === 'mouse') (impl === 'plainvars' ? plain.mouseVars : plain.mouseRoot)();
  else if (scenario === 'mouselocal') plain.mouseLocalVars();
  else if (scenario === 'live200' || scenario === 'live2s') plain.liveVars(scenario === 'live200' ? 200 : 2000);
} else {
  var tImport = performance.now();
  ({ static: () => plain.static(), staticjs: () => plain.static(), live2s: () => plain.live(2000), live200: () => plain.live(200), mouse: () => plain.mouse() })[scenario]();
}
const initMs = performance.now() - tImport;
await new Promise((r) => requestAnimationFrame(() => setTimeout(r)));
const firstFrameMs = performance.now() - tImport; // includes the first style recalc, layout and paint

// Workload drivers run during the measurement window.
let stopped = false; // drivers stop after clear() so cleanup measurements see an idle page
const clicks = { n: 0, ms: 0, samples: [] };
/** Clicks k elements per frame and times each dispatch (action + state update + notifications). */
function clicker(list, k) {
  let i = 0;
  const f = () => {
    if (stopped) return;
    const items = list();
    for (let j = 0; j < k && items.length; j++) {
      const t = performance.now();
      items[(i = (i * 7 + 13) % items.length)].click();
      const d = performance.now() - t;
      clicks.n++; clicks.ms += d; clicks.samples.push(d);
    }
    requestAnimationFrame(f);
  };
  f();
}
const drivers = {
  components() { clicker(() => root.querySelectorAll('b'), 20); },
  geometry() {
    let i = 0;
    const f = () => { if (stopped) return; root.style.width = 400 + (i++ % 200) + 'px'; requestAnimationFrame(f); };
    f();
  },
  components_runtime() { clicker(() => root.querySelectorAll('b'), 20); },
  fanout_runtime() { clicker(() => [document.getElementById('t')], 1); },
  bindcheck() { clicker(() => root.querySelectorAll('input'), 20); },
  changed() { clicker(() => root.querySelectorAll('b'), 20); },
  keyout() { clicker(() => [document.body], 1); }, // a click outside every component
  attrsplit() { clicker(() => root.querySelectorAll('b'), 20); },
  textcount() { clicker(() => root.querySelectorAll('b'), 20); },
  pressed() { clicker(() => root.querySelectorAll('.pb'), 20); },
  derived() { clicker(() => root.querySelectorAll('.dv b'), 20); },
  pressedstate() { clicker(() => root.querySelectorAll('.pb'), 20); },
  bindtext() {
    // 20 inputs per frame get one more character, as a typing user produces input events.
    let i = 0, k = 0;
    const inputs = () => root.querySelectorAll('input');
    const f = () => {
      if (stopped) return;
      const list = inputs();
      for (let j = 0; j < 20 && list.length; j++) {
        const el = list[(i = (i * 7 + 13) % list.length)];
        el.value = String(k++ % 1000);
        const t = performance.now();
        el.dispatchEvent(new InputEvent('input', { bubbles: true }));
        const d = performance.now() - t;
        clicks.n++; clicks.ms += d; clicks.samples.push(d);
      }
      requestAnimationFrame(f);
    };
    f();
  },
  fanout() { clicker(() => [document.getElementById('t')], 1); },
  tabsstate() { clicker(() => root.querySelectorAll('.tab'), 20); },
  nested() { clicker(() => root.querySelectorAll('b'), 20); },
  statechurn() {
    const k = Math.max(1, Math.floor(n / 100));
    const f = () => {
      if (stopped) return;
      for (let i = 0; i < k; i++) { root.firstElementChild?.remove(); const c = document.createElement('span'); c.className = 'c'; c.innerHTML = COMPONENT; root.append(c); }
      requestAnimationFrame(f);
    };
    f();
    clicker(() => root.querySelectorAll('b'), 5);
  },
  mouselocal() { drivers.mouse(); },
  // Every frame, remove the oldest 1% of elements and append as many new ones.
  churn() {
    const k = Math.max(1, Math.floor(n / 100));
    const f = () => {
      if (stopped) return;
      for (let i = 0; i < k; i++) { root.firstElementChild?.remove(); root.append(Object.assign(document.createElement('div'), { className: 'e' })); }
      if (!stopped) requestAnimationFrame(f);
    };
    f();
  },
  mouse() { let i = 0; const f = () => { dispatchEvent(new PointerEvent('pointermove', { clientX: i % 600, clientY: (i * 7) % 400 })); i++; if (!stopped) requestAnimationFrame(f); }; f(); },
  checkbox() { const boxes = [...root.querySelectorAll('input')]; let i = 0; const f = () => { for (let k = 0; k < 20; k++) boxes[(i++) % boxes.length].click(); if (!stopped) requestAnimationFrame(f); }; f(); },
  nthvar() { const gs = [...root.children]; let i = 0; const f = () => { for (let k = 0; k < 20; k++) gs[(i++) % gs.length].style.setProperty('--active', 1 + (i % 10)); if (!stopped) requestAnimationFrame(f); }; f(); },
};

window.bench = {
  initMs,
  firstFrameMs,
  stats: () => api?.stats(),
  diagnostics: () => api?.diagnostics ?? [],
  drive: () => drivers[scenario]?.(),
  /** Collects frame intervals for `ms`. */
  frames(ms) {
    return new Promise((res) => {
      const out = []; let last = performance.now(); const end = last + ms;
      const f = (t) => { out.push(t - last); last = t; if (t < end) requestAnimationFrame(f); else res(out); };
      requestAnimationFrame(f);
    });
  },
  /** Insert n reactive elements, wait until bound, then remove them; returns timings. */
  async insertRemove() {
    const f = document.createDocumentFragment();
    for (let i = 0; i < n; i++) f.append(Object.assign(document.createElement('div'), { className: 'e' }));
    const t = performance.now();
    root.append(f);
    await new Promise((r) => setTimeout(r));
    const bound = api.stats().bindings;
    const insertMs = performance.now() - t;
    const t2 = performance.now();
    root.replaceChildren();
    await new Promise((r) => setTimeout(r));
    return { insertMs, bound, removeMs: performance.now() - t2, after: api.stats() };
  },
  clear() { stopped = true; root.replaceChildren(); },
  resetClicks() { clicks.n = 0; clicks.ms = 0; clicks.samples = []; },
  clicks: () => {
    const s = [...clicks.samples].sort((a, b) => a - b);
    const p = (q) => s[Math.min(s.length - 1, Math.floor(q * s.length))];
    return clicks.n ? { n: clicks.n, avgMs: clicks.ms / clicks.n, p50: p(0.5), p95: p(0.95), p99: p(0.99) } : undefined;
  },
};
</script>
