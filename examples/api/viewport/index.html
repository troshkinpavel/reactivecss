<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viewport tracking — Reactive CSS API example</title>
  <link rel="stylesheet" href="../api.css">
  <link rel="stylesheet" href="style.css">
  <script src="../../../dist/reactive-css.min.js" defer></script>
</head>
<body>
  <main>
    <p class="kicker">API example 15 · <code>viewport()</code></p>
    <h1>Viewport tracking</h1>
    <p class="lede">The viewport size as a value, kept current by the browser itself.</p>
    <section class="demo vp" aria-label="Viewport size">
      <p class="size"><span class="w"></span> × <span class="h"></span> px</p>
      <div class="track" aria-hidden="true"><span class="fill"></span></div>
      <p class="readout">Resize the browser window. The bar shows the width out of 1600 px.</p>
    </section>
    <p class="files"><a href="style.css">style.css</a> · <a href="README.md">README</a> · <a href="../">All API examples</a></p>
  </main>
</body>
