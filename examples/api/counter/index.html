<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Counter — Reactive CSS API example</title>
  <link rel="stylesheet" href="../api.css">
  <link rel="stylesheet" href="style.css">
  <script src="../../../dist/reactive-css.min.js" defer></script>
</head>
<body>
  <main>
    <p class="kicker">API example 01 · <code>state()</code> <code>increment()</code> <code>decrement()</code></p>
    <h1>Counter</h1>
    <p class="lede">A number that buttons change. The value is real text in the page.</p>
    <section class="demo counter" aria-label="Counter">
      <button type="button" class="dec" aria-label="Decrease">−</button>
      <output class="value" aria-live="polite">0</output>
      <button type="button" class="inc" aria-label="Increase">+</button>
    </section>
    <p class="files"><a href="style.css">style.css</a> · <a href="README.md">README</a> · <a href="../">All API examples</a></p>
  </main>
</body>
</html>
