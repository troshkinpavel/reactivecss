<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pick a value — Reactive CSS API example</title>
  <link rel="stylesheet" href="../api.css">
  <link rel="stylesheet" href="style.css">
  <script src="../../../dist/reactive-css.min.js" defer></script>
</head>
<body>
  <main>
    <p class="kicker">API example 04 · <code>pick()</code> <code>set()</code></p>
    <h1>Pick a value</h1>
    <p class="lede">A random choice from a short list, kept as a state and shown as text.</p>
    <section class="demo pick" aria-label="Pick a fruit">
      <p class="result" aria-live="polite">Apple</p>
      <div class="row">
        <button type="button" class="again">Pick again</button>
        <span class="readout">picks: <span class="count">0</span></span>
      </div>
    </section>
    <p class="files"><a href="style.css">style.css</a> · <a href="README.md">README</a> · <a href="../">All API examples</a></p>
  </main>
</body>
</html>
