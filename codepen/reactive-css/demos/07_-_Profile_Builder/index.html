<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Builder · ReactiveCSS</title>
    <link rel="stylesheet" href="../../lib/theme.css">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>

    <main>
      <a class="back" href="../../index.html">← All demos</a>
      <p class="kicker">Reactive CSS · 07</p>
      <h1>Profile Builder</h1>
      <p class="lede">Fill in the form and the card follows every keystroke. Leave the email field to check it.</p>

      <section class="profile" aria-label="Profile builder">
        <article class="card" aria-label="Preview">
          <div class="avatar" aria-hidden="true"></div>
          <div>
            <h2 class="name">Your name</h2>
            <p class="role">Designer</p>
          </div>
          <span class="badge">Available</span>
        </article>

        <form>
          <label>Name <input type="text" name="name" placeholder="Ada Lovelace" autocomplete="off"></label>
          <label>Role
            <select name="role">
              <option>Designer</option>
              <option>Developer</option>
              <option>Writer</option>
              <option>Researcher</option>
            </select>
          </label>
          <label>Color <input type="range" name="hue" min="0" max="359" value="250"></label>
          <label>Email
            <input type="email" name="email" placeholder="ada@example.com" autocomplete="off">
            <span class="error">Please enter a valid email address.</span>
          </label>
          <label class="check"><input type="checkbox" name="available"> Available for work</label>
          <button type="reset">Reset</button>
        </form>
      </section>
    </main>

    <script src="../../lib/reactive-css-0.9.0.min.js" defer></script>
  </body>
</html>
