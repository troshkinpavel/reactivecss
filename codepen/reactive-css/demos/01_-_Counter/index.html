<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter · ReactiveCSS</title>
    <link rel="stylesheet" href="../../lib/theme.css">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>

    <main>
      <a class="back" href="../../index.html">← All demos</a>
      <p class="kicker">Reactive CSS · 01</p>
      <h1>Counter</h1>
      <p class="lede">State, clicks and DOM text. No JavaScript, only CSS.</p>

      <section class="counter" aria-label="Counter">
        <div class="row">
          <button type="button" class="dec" aria-label="Decrease">−</button>
          <output class="value" aria-live="polite">0</output>
          <button type="button" class="inc" aria-label="Increase">+</button>
        </div>
        <button type="button" class="reset">Reset</button>
      </section>
    </main>

    <script src="../../lib/reactive-css-0.9.0.min.js" defer></script>
  </body>
</html>
