<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme · ReactiveCSS</title>
    <link rel="stylesheet" href="../../lib/theme.css">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>

    <main>
      <a class="back" href="../../index.html">← All demos</a>
      <p class="kicker">Reactive CSS · 06</p>
      <h1>Theme</h1>
      <p class="lede">Pick a color scheme and an accent, then reload the page. Your choice stays.</p>

      <section class="theme" aria-label="Theme settings">
        <div class="group" role="group" aria-label="Color scheme">
          <button type="button" class="auto">Auto</button>
          <button type="button" class="light">Light</button>
          <button type="button" class="dark">Dark</button>
        </div>

        <div class="swatches" role="group" aria-label="Accent color">
          <button type="button" class="orange" style="--h: 38"  aria-label="Orange"></button>
          <button type="button" class="green"  style="--h: 150" aria-label="Green"></button>
          <button type="button" class="blue"   style="--h: 250" aria-label="Blue"></button>
          <button type="button" class="violet" style="--h: 300" aria-label="Violet"></button>
          <button type="button" class="pink"   style="--h: 0"   aria-label="Pink"></button>
        </div>

        <article class="sample">
          <span class="tag">Preview</span>
          <h2>Field notes</h2>
          <p>The whole page reads one state on <code>:root</code>. It is saved in localStorage by <code>persist()</code>.</p>
          <a href="#" class="cta">Read more →</a>
        </article>

        <p class="readout">scheme <output class="scheme">auto</output> · hue <output class="hue">38</output></p>
      </section>
    </main>

    <script src="../../lib/reactive-css-0.9.0.min.js" defer></script>
  </body>
</html>
