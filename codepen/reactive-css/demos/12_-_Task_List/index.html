<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List · ReactiveCSS</title>
    <link rel="stylesheet" href="../../lib/theme.css">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>

    <main>
      <a class="back" href="../../index.html">← All demos</a>
      <p class="kicker">Reactive CSS · 12</p>
      <h1>Task List</h1>
      <p class="lede">Each task owns its own state, and the list counts them. Two levels of state, no script.</p>

      <section class="tasks" aria-label="Release checklist">
        <header>
          <h2>Release 0.9</h2>
          <p class="count"><output class="done">0</output> of 5 done</p>
        </header>
        <div class="bar" aria-hidden="true"><span></span></div>

        <label class="task"><input type="checkbox"> <span>Draft the release notes</span></label>
        <label class="task"><input type="checkbox"> <span>Run the engine tests</span></label>
        <label class="task"><input type="checkbox"> <span>Check the examples in Safari</span></label>
        <label class="task"><input type="checkbox"> <span>Build the bundles</span></label>
        <label class="task"><input type="checkbox"> <span>Tag the release</span></label>

        <p class="party">All done. Ship it!</p>
      </section>
    </main>

    <script src="../../lib/reactive-css-0.9.0.min.js" defer></script>
  </body>
</html>
