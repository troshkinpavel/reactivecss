<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag · ReactiveCSS</title>
    <link rel="stylesheet" href="../../lib/theme.css">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>

    <main>
      <a class="back" href="../../index.html">← All demos</a>
      <p class="kicker">Reactive CSS · 03</p>
      <h1>Drag</h1>
      <p class="lede">Drag the card with a mouse, pen or finger, or focus it and use the arrow keys.</p>

      <section class="drag" aria-label="Draggable card">
        <div class="area">
          <div class="card" tabindex="0" aria-label="Draggable card. Arrow keys move it.">Drag me</div>
        </div>
        <p class="readout">x <output class="x">0px</output> · y <output class="y">0px</output></p>
      </section>
    </main>

    <script src="../../lib/reactive-css-0.9.0.min.js" defer></script>
  </body>
</html>
