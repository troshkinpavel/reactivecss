<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palette · ReactiveCSS</title>
    <link rel="stylesheet" href="../../lib/theme.css">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>

    <div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>

    <main>
      <a class="back" href="../../index.html">← All demos</a>
      <p class="kicker">Reactive CSS · 09</p>
      <h1>Palette</h1>
      <p class="lede">Roll a new palette. Each click picks five random hues and a name. The blobs behind move on their own.</p>

      <section class="palette" aria-label="Palette generator">
        <div class="swatches">
          <div class="swatch s1"><output class="h1">20</output>°</div>
          <div class="swatch s2"><output class="h2">90</output>°</div>
          <div class="swatch s3"><output class="h3">160</output>°</div>
          <div class="swatch s4"><output class="h4">230</output>°</div>
          <div class="swatch s5"><output class="h5">300</output>°</div>
        </div>
        <p class="mood"><output class="name">Rainbow</output></p>
        <button type="button" class="roll">Roll palette</button>
      </section>
    </main>

    <script src="../../lib/reactive-css-0.9.0.min.js" defer></script>
  </body>
</html>
