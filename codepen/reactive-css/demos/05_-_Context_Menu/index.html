<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Context Menu · ReactiveCSS</title>
    <link rel="stylesheet" href="../../lib/theme.css">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>

    <main>
      <a class="back" href="../../index.html">← All demos</a>
      <p class="kicker">Reactive CSS · 05</p>
      <h1>Context Menu</h1>
      <p class="lede">Right-click the desk. The menu opens where you clicked and stays inside the desk.</p>

      <section class="ctx" aria-label="Context menu">
        <div class="stage">
          <div class="desk" tabindex="0" aria-label="Desk. Right-click, or press Shift+F10, for the menu.">
            <p class="hint">Right-click anywhere</p>
          </div>
          <div class="menu" role="menu" aria-label="Desk actions">
            <button type="button" role="menuitem" data-action="New note">New note</button>
            <button type="button" role="menuitem" data-action="Paste">Paste</button>
            <button type="button" role="menuitem" data-action="Sort by name">Sort by name</button>
            <button type="button" role="menuitem" data-action="Clear desk">Clear desk</button>
          </div>
        </div>
        <p class="readout">Last action: <output class="last">none</output></p>
      </section>
    </main>

    <script src="../../lib/reactive-css-0.9.0.min.js" defer></script>
  </body>
</html>
