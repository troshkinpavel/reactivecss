<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History · ReactiveCSS</title>
    <link rel="stylesheet" href="../../lib/theme.css">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>

    <main>
      <a class="back" href="../../index.html">← All demos</a>
      <p class="kicker">Reactive CSS · 10</p>
      <h1>History</h1>
      <p class="lede">A state remembers its last value and which way it moved. The number slides up or down to match.</p>

      <section class="history" aria-label="Temperature">
        <div class="row">
          <button type="button" class="down" aria-label="Colder">−</button>
          <p class="reading"><output class="now" aria-live="polite">20</output><span class="unit">°C</span></p>
          <button type="button" class="up" aria-label="Warmer">+</button>
        </div>
        <p class="readout">
          <span class="arrow" aria-hidden="true">▲</span>
          <output class="word">no change yet</output>
          · was <output class="prev">20</output>°C
        </p>
      </section>
    </main>

    <script src="../../lib/reactive-css-0.9.0.min.js" defer></script>
  </body>
</html>
