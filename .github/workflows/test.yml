# Validation only: no publishing, no deployment, no secrets. Runs on pull requests and on pushes
# to main. Firefox is not part of the local verification (Playwright's Firefox does not start on the
# development machine), so its job is informational until it has passed here.
name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Distribution tests (Node import, TypeScript consumer)
        run: npx vitest run --dir tests/dist && npx tsc -p tests/dist/tsconfig.json
      - name: Package contents
        run: npm pack --dry-run
      # Browsers are cached per Playwright version (the lockfile): a cold download once took 28 minutes.
      # Saved right after the install, so a failing test does not throw the download away.
      - name: Restore Playwright browsers
        id: pw-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        name: Save Playwright browsers
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
      - run: npx playwright test --project=chromium --project=webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: library-playwright
          path: test-results/
          retention-days: 7

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/mcp/package-lock.json
      # The server bundles the library's compiler and reads its built dist/ for the measured sizes.
      - run: npm ci && npm run build
        working-directory: .
      - run: npm ci
      - run: npm run typecheck
      - name: Build, unit and protocol tests
        run: npm test
      - name: Clean-install consumer test
        run: npm run test:consumer
      - name: Package contents
        run: npm pack --dry-run

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      # The site reads the library's bundles and registry from ../dist.
      - run: npm ci && npm run build
        working-directory: .
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Browsers are cached per Playwright version (the lockfile): a cold download once took 28 minutes.
      # Saved right after the install, so a failing test does not throw the download away.
      - name: Restore Playwright browsers
        id: pw-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        name: Save Playwright browsers
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # Chromium only, and screenshot baselines (recorded on macOS) are not compared: the full
      # Chromium + WebKit run with screenshots is `npm run test:e2e` locally.
      - run: npx playwright test --project=chromium --ignore-snapshots
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: site-playwright
          path: site/test-results/
          retention-days: 7

  library-firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Browsers are cached per Playwright version (the lockfile): a cold download once took 28 minutes.
      # Saved right after the install, so a failing test does not throw the download away.
      - name: Restore Playwright browsers
        id: pw-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-firefox-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps firefox
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        name: Save Playwright browsers
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-firefox-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps firefox
      - run: npx playwright test --project=firefox
