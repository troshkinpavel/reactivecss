<div class="wizard">
  <div class="dots" aria-label="Steps">
    <button class="dot"><span class="num">1</span> Account</button>
    <button class="dot"><span class="num">2</span> Plan</button>
    <button class="dot"><span class="num">3</span> Confirm</button>
  </div>
  <div class="panels" aria-live="polite">
    <div class="panel">
      <span class="kicker">Step 1 of 3</span>
      <span class="title">Account</span>
      <span class="text">Choose an email address and a password.</span>
    </div>
    <div class="panel">
      <span class="kicker">Step 2 of 3</span>
      <span class="title">Plan</span>
      <span class="text">Pick a plan. You can change it later.</span>
    </div>
    <div class="panel">
      <span class="kicker">Step 3 of 3</span>
      <span class="title">Confirm</span>
      <span class="text">Review your details and create the account.</span>
    </div>
  </div>
  <div class="actions">
    <button class="next">Next →</button>
  </div>
</div>
