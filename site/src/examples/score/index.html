<div class="score">
  <div class="row">
    <button class="down square" aria-label="Lower the score">−</button>
    <output class="value" aria-live="polite"></output>
    <button class="up square" aria-label="Raise the score">+</button>
  </div>
  <p class="meta">
    <span>previous <span class="before"></span></span>
    <span class="trend"></span>
  </p>
</div>
