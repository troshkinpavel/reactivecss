<div class="accordion">
  <div class="item">
    <button aria-expanded="false">
      Is it a framework?
      <span class="chevron" aria-hidden="true">⌄</span>
    </button>
    <div class="body">
      No. It extends the CSS you already write with state and events.
    </div>
  </div>
  <div class="item">
    <button aria-expanded="false">
      Do I need a build step?
      <span class="chevron" aria-hidden="true">⌄</span>
    </button>
    <div class="body">
      No. Load one script on the page and write stylesheets as usual.
    </div>
  </div>
  <div class="item">
    <button aria-expanded="false">
      Should I use &lt;details&gt; instead?
      <span class="chevron" aria-hidden="true">⌄</span>
    </button>
    <div class="body">
      Often, yes. Native details and summary need no script at all. Use state when you need custom behavior.
    </div>
  </div>
</div>
