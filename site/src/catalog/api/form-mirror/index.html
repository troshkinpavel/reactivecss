<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form mirror — Reactive CSS example</title>
</head>
<body>
  <main>
    <p class="kicker">API example 03 · <code>state()</code> <code>bind()</code> <code>:on()</code> <code>event()</code> <code>content</code></p>
    <h1>Form mirror</h1>
    <p class="lede">Type in the field and the preview follows; the Clear button resets both.</p>
    <section class="demo mirror" aria-label="Form mirror">
      <form>
      <label class="field">Your name <input type="text" name="name" autocomplete="off" placeholder="Ada"></label>
      <p class="preview">Hello, <output class="name">stranger</output>.</p>
      <button type="reset" class="clear">Clear</button>
      </form>
    </section>
  </main>
</body>
</html>
