<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attribute sync — Reactive CSS example</title>
</head>
<body>
  <main>
    <p class="kicker">API example 07 · <code>--attr-*</code> <code>toggle()</code></p>
    <h1>Attribute sync</h1>
    <p class="lede">Keep real DOM attributes synchronized with CSS state.</p>
    <section class="demo disclosure" aria-label="Attribute sync">
      <button type="button" class="toggle" aria-expanded="false" aria-controls="shipping-details">Shipping details</button>
      <div class="panel" id="shipping-details" hidden>
        <p>Orders ship within two working days. Returns are free for 30 days.</p>
      </div>
    </section>
  </main>
</body>
</html>
