<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Click coordinates — Reactive CSS example</title>
</head>
<body>
  <main>
    <p class="kicker">API example 05 · <code>:on()</code> <code>event()</code> <code>set()</code></p>
    <h1>Click coordinates</h1>
    <p class="lede">Capture the pointer position when an event occurs.</p>
    <section class="demo coords" aria-label="Click coordinates">
      <div class="pad"><i class="marker" aria-hidden="true"></i></div>
      <p class="readout">x <output class="x">0px</output> · y <output class="y">0px</output> · clicks <output class="n">0</output></p>
    </section>
  </main>
</body>
</html>
