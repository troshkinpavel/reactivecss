<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random colors — Reactive CSS example</title>
</head>
<body>
  <main>
    <p class="kicker">API example 14 · <code>random()</code> <code>set()</code></p>
    <h1>Random colors</h1>
    <p class="lede">Each click rolls a new hue and picks a new name.</p>
    <section class="demo random" aria-label="Random colors">
      <div class="swatch" aria-hidden="true"></div>
      <p class="readout">hue <output class="hue">200</output>° · <output class="mood">calm</output></p>
      <button type="button" class="roll">New color</button>
    </section>
  </main>
</body>
</html>
