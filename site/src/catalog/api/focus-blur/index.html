<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus & blur — Reactive CSS example</title>
</head>
<body>
  <main>
    <p class="kicker">API example 08 · <code>focus:</code> <code>:blur</code></p>
    <h1>Focus & blur</h1>
    <p class="lede">Request focus and react when an element loses it.</p>
    <section class="demo focusing" aria-label="Focus and blur">
      <button type="button" class="open" aria-expanded="false">Search</button>
      <input class="field" type="search" placeholder="Find a page" aria-label="Search">
      <p class="hint">Press Search, type, then Tab away from the field.</p>
    </section>
  </main>
</body>
</html>
