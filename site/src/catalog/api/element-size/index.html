<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Element size — Reactive CSS example</title>
</head>
<body>
  <main>
    <p class="kicker">API example 11 · <code>element()</code> <code>:on()</code></p>
    <h1>Element size</h1>
    <p class="lede">A card reads its own measured width, and its text follows.</p>
    <section class="demo size" aria-label="Element size">
      <label class="row">width <input class="width" type="range" min="140" max="420" value="300"> <output class="set">300</output>px</label>
      <div class="card"><span class="big">Aa</span></div>
      <p class="readout">measured: <span class="measured"></span> px</p>
    </section>
  </main>
</body>
</html>
