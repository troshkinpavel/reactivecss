<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>State toggle — Reactive CSS example</title>
</head>
<body>
  <main>
    <p class="kicker">API example 02 · <code>toggle()</code> <code>:when()</code></p>
    <h1>State toggle</h1>
    <p class="lede">One boolean state that a button flips, and styles that follow it.</p>
    <section class="demo toggle" aria-label="State toggle">
      <button type="button" class="switch" aria-pressed="false">
        <span class="track" aria-hidden="true"><span class="knob"></span></span>
        <span class="label">Off</span>
      </button>
    </section>
  </main>
</body>
</html>
