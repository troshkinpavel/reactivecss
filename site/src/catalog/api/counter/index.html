<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Counter — Reactive CSS example</title>
</head>
<body>
  <main>
    <p class="kicker">API example 01 · <code>state()</code> <code>:on()</code> <code>increment()</code> <code>decrement()</code> <code>content</code></p>
    <h1>Counter</h1>
    <p class="lede">A number controlled entirely through CSS state and events.</p>
    <section class="demo counter" aria-label="Counter">
      <button type="button" class="dec" aria-label="Decrease">−</button>
      <output class="value" aria-live="polite">0</output>
      <button type="button" class="inc" aria-label="Increase">+</button>
    </section>
  </main>
</body>
</html>
