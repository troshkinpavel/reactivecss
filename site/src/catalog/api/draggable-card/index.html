<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Draggable card — Reactive CSS example</title>
</head>
<body>
  <main>
    <p class="kicker">API example 06 · <code>:on(drag)</code> <code>event()</code></p>
    <h1>Draggable card</h1>
    <p class="lede">Move an element using declarative drag events.</p>
    <section class="demo drag" aria-label="Draggable card">
      <div class="area">
        <div class="card" tabindex="0" aria-label="Draggable card. Arrow keys move it.">Drag me</div>
      </div>
      <p class="readout">x <output class="x">0px</output> · y <output class="y">0px</output></p>
    </section>
  </main>
</body>
</html>
