<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conditional state — Reactive CSS example</title>
</head>
<body>
  <main>
    <p class="kicker">API example 12 · <code>cycle()</code> <code>when()</code> <code>:when()</code></p>
    <h1>Conditional state</h1>
    <p class="lede">One stored state with three values, and styles chosen from it.</p>
    <section class="demo status" aria-label="Conditional state">
      <p class="badge"><i class="dot" aria-hidden="true"></i><output class="label" aria-live="polite">idle</output></p>
      <button type="button" class="next"><span class="action">Start</span></button>
    </section>
  </main>
</body>
</html>
