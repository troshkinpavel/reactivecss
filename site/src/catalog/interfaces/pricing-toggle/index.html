<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pricing toggle — Reactive CSS example</title>
</head>
<body>
  <main>
    <p class="kicker">Interface 08 · <code>state()</code> <code>toggle()</code> <code>--attr-*</code> <code>when()</code> <code>content</code></p>
    <h1>Pricing toggle</h1>
    <p class="lede">A billing switch changes the price and shows the annual saving, with role="switch" kept in sync.</p>
    <section class="demo billing" aria-label="Pricing toggle">
      <button class="switch" role="switch" aria-checked="false">Bill annually</button>
      <p class="price">$10 / month</p>
      <span class="saving">2 months free</span>
    </section>
  </main>
</body>
</html>
