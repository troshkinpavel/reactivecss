<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theme switcher — Reactive CSS example</title>
</head>
<body>
  <main>
    <p class="kicker">Interface 04 · <code>state()</code> <code>cycle()</code> <code>:when()</code> <code>content</code></p>
    <h1>Theme switcher</h1>
    <p class="lede">One keyword state cycles through three themes, and the page colors and the button label follow it.</p>
    <section class="demo themes" aria-label="Theme switcher">
      <div class="bar">
        <strong>Field notes</strong>
        <button class="switch">Theme: <span class="name">light</span></button>
      </div>
      <p>The colors come from one state on this section. Each click moves to the next theme in the list.</p>
    </section>
  </main>
</body>
</html>
