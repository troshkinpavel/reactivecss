<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task list — Reactive CSS example</title>
</head>
<body>
  <main>
    <p class="kicker">Interface 07 · <code>state()</code> <code>event()</code> <code>:just-checked</code> <code>when()</code></p>
    <h1>Task list</h1>
    <p class="lede">Native checkboxes whose label fades when done, with a short animation when a task is checked or unchecked.</p>
    <section class="demo tasks" aria-label="Task list">
      <label class="task"><input type="checkbox"> <span>Draft the release notes</span></label>
      <label class="task"><input type="checkbox"> <span>Run the engine tests</span></label>
      <label class="task"><input type="checkbox"> <span>Tag the release</span></label>
    </section>
  </main>
</body>
</html>
